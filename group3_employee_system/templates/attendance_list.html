{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Attendance</h2>
    <a href="{% url 'attendance_create' %}" class="btn btn-primary">+ Add Attendance</a>
</div>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Employee</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for record in records %}
        <tr>
            <td>{{ record.employee }}</td>
            <td>{{ record.date }}</td>
            <td>{{ record.status }}</td>
            <td>
                <a href="{% url 'attendance_update' record.pk %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'attendance_delete' record.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-center">No attendance records yet.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
