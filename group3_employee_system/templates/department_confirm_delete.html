{% extends "base.html" %}
{% block title %}Delete Department{% endblock %}
{% block content %}
<h2>Delete Department</h2>
<p class="mt-3">Are you sure you want to delete <strong>{{ department.name }}</strong>?</p>
<p class="text-danger">Warning: all employees in this department will also be deleted.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'department_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
