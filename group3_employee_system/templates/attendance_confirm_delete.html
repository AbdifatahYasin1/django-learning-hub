{% extends 'base.html' %}

{% block content %}
<h2>Delete Attendance</h2>
<p>Are you sure you want to delete the attendance record for
   <strong>{{ record.employee }}</strong> on <strong>{{ record.date }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'attendance_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
